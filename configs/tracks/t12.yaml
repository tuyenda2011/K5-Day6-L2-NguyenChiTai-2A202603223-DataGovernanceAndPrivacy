# Defaults for T12 — see docs/tracks/T12.md
# Pipeline must write out/batch_decisions.csv. Freeze params BEFORE looking at eval results.
track: t12
input: fixtures/t12_vendor_batches
pred_file: batch_decisions.csv
params:
  audit_budget_per_batch: 20
  max_error_rate: 0.05
  sampling_strategy: stratified
  allocation: proportional
  # null = fixed budget, same as baseline. Use [15, 20] for the sequential variant.
  audit_stages: null
eval_params:
  max_hold_rate: 0.4  # guardrail: primary only valid if HOLD rate stays below this
